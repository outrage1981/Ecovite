<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EDE6D9" />
  <title>EcoVite Lick Comparison</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div class="boot-loading">Loading…</div>
  </div>

  <template id="tpl-login">
    <div class="auth-screen">
      <div class="auth-card card">
        <div class="brand">
          <div class="brand-mark">EV</div>
          <div>
            <h1>EcoVite</h1>
            <p class="muted">Lick Cost Comparison</p>
          </div>
        </div>
        <form id="login-form">
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <p class="form-error" id="login-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
        <p class="faint" style="margin-top:10px;"><a href="#" id="forgot-password-link">Forgot password?</a></p>
        <p class="demo-hint" id="demo-hint" hidden></p>
      </div>
    </div>
  </template>

  <template id="tpl-forgot-password">
    <div class="auth-screen">
      <div class="auth-card card">
        <div class="brand">
          <div class="brand-mark">EV</div>
          <div>
            <h1>EcoVite</h1>
            <p class="muted">Reset your password</p>
          </div>
        </div>
        <form id="forgot-password-form">
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <p class="form-error" id="forgot-password-error" hidden></p>
          <p class="form-success" id="forgot-password-success" hidden></p>
          <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>
        <p class="faint" style="margin-top:10px;"><a href="#" id="back-to-login-link">Back to sign in</a></p>
      </div>
    </div>
  </template>

  <template id="tpl-reset-password">
    <div class="auth-screen">
      <div class="auth-card card">
        <div class="brand">
          <div class="brand-mark">EV</div>
          <div>
            <h1>EcoVite</h1>
            <p class="muted">Set a new password</p>
          </div>
        </div>
        <form id="reset-password-form">
          <label class="field">
            <span>New password</span>
            <input type="password" name="password" autocomplete="new-password" required minlength="8" />
          </label>
          <label class="field">
            <span>Confirm new password</span>
            <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8" />
          </label>
          <p class="form-error" id="reset-password-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block">Set new password</button>
        </form>
      </div>
    </div>
  </template>

  <script>
    // Browsers block ES module scripts from loading over file:// (the
    // module fetch is silently CORS-blocked), so js/app.js never runs and
    // the "Loading…" placeholder above sits there forever with no error.
    // This is a plain classic script — it still runs over file:// — so it
    // can catch that case and say something useful instead.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div class="boot-loading" style="flex-direction:column; gap:10px; text-align:center; padding:20px;">' +
        '<strong>This app needs to be served over http://, not opened as a file.</strong>' +
        '<span class="muted">Run <code>tools/static-server.ps1</code>, or <code>python -m http.server 8080</code> in this folder, then open http://localhost:8080.</span>' +
        '</div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
